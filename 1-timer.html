<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 1 - Countdown Timer</title>
  <script type="module" crossorigin src="/vanilla-app-template/assets/timer-CV4PhLcm.js"></script>
  <link rel="modulepreload" crossorigin href="/vanilla-app-template/assets/iziToast.min-CvFvRQE4.js">
  <link rel="stylesheet" crossorigin href="/vanilla-app-template/assets/iziToast-DnveWo0P.css">
  <link rel="stylesheet" crossorigin href="/vanilla-app-template/assets/timer-BArvkMiJ.css">
  <link rel="stylesheet" crossorigin href="/vanilla-app-template/assets/styles-4wZw0w-l.css">
</head>

<body>
    <div class="container">
        <header style="margin-top: 20px;">
            <a href="./index.html" class="back-link">Back to Home</a>
        </header>

        <main class="timer-main">
            <div class="controls">
                <input type="text" id="datetime-picker" />
                <button type="button" data-start disabled>Start</button>
            </div>

            <div class="timer">
                <div class="field">
                    <span class="value" data-days>00</span>
                    <span class="label">Days</span>
                </div>
                <div class="field">
                    <span class="value" data-hours>00</span>
                    <span class="label">Hours</span>
                </div>
                <div class="field">
                    <span class="value" data-minutes>00</span>
                    <span class="label">Minutes</span>
                </div>
                <div class="field">
                    <span class="value" data-seconds>00</span>
                    <span class="label">Seconds</span>
                </div>
            </div>
        </main>
    </div>

</body>

</html>
